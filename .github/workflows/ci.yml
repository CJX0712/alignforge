name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pytest ruff

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check . || true

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Demo smoke (headline benchmark)
        env:
          PYTHONPATH: ${{ github.workspace }}
          ALIGNFORGE_N_PROMPTS: "24"
          ALIGNFORGE_K_CANDIDATES: "8"
          ALIGNFORGE_N_PAIRS: "20"
          ALIGNFORGE_N_SEEDS: "2"
        run: python examples/run_demo.py
